# =============================================================================
# netlify.toml -- single source of truth for build, publish, functions, headers.
#
# This file was previously ignored by Netlify entirely (the site's
# `configuration_file_path` was null, so Netlify used its own dashboard values:
# `yarn build` publishing `dist`, which never existed). Those dashboard values
# have been corrected to point back at this file, and the site is configured
# with skip_automatic_builds so NO remote builder is ever started.
#
# Deploys are performed by uploading a prebuilt directory:
#     netlify deploy --dir=site/public --functions=netlify/functions [--prod]
# which consumes zero Netlify build minutes. See ci/run.sh.
# =============================================================================

[build]
  publish = "site/public"
  # Remote builds are DISABLED on this site (`skip_automatic_builds`), and
  # deploys upload a prebuilt directory instead, so this command is not normally
  # run by Netlify. It is kept because the documented [build] keys are base,
  # publish, command, environment and processing -- a site with no command
  # inherits whatever the UI has, which is how this repo ended up running
  # `yarn build` against a `dist/` that never existed.
  #
  # `functions` is NOT a [build] key. It sat here and was silently ignored; the
  # functions directory is declared by [functions] directory below.
  command = "npm run build"

# Pretty URLs: Hugo writes inventory/index.html; this lets Netlify serve
# /inventory/ from it without the filename. Netlify still prefers the explicit
# file, so nothing breaks if the setting is ever lost.
[build.processing.html]
  pretty_urls = true

[build.environment]
  # Keep in sync with .nvmrc, .tool-versions and ci/Containerfile.
  NODE_VERSION = "24"
  HUGO_VERSION = "0.166.0"
  # Hugo Pipes is the front-end pipeline; make sure nothing tries to shell out
  # to a system `hugo` that may be a non-extended build.
  HUGO_ENV     = "production"
  NODE_ENV     = "production"
  # npm 11 blocks dependency lifecycle scripts by default; the project .npmrc
  # allowlists the ones we actually need.
  NPM_FLAGS    = "--no-audit --no-fund"

# -----------------------------------------------------------------------------
# Context scoping
#
# Netlify has FOUR contexts, not one: production, deploy-preview (every pull
# request), branch-deploy (every other branch), and local `netlify dev`.
#
# This file previously declared NO context sections at all. That is not a
# neutral default. Anything configured in the Netlify UI for "production" is
# also offered to deploy previews, so a preview of a pull request can reach the
# production database, the production CMS, or production API keys. For a site
# whose open question Q3 is "where does the data live at all", an unreviewed
# fork silently inheriting production credentials is the worst available default.
#
# So the guard is explicit rather than assumed. Previews and branch deploys get
# a marker JWT_SECRET that the auth middleware treats as unconfigured, and empty
# connection strings that database-service reports as misconfigured. A preview
# therefore CANNOT mutate production, and it fails safe rather than failing open.
#
# The marker is deliberately not a secret and deliberately not a valid secret.
[context.deploy-preview.environment]
  JWT_SECRET              = "deploy-preview-not-configured"
  DATABASE_URL            = ""
  SUPABASE_DB_URL         = ""
  TURSO_DATABASE_URL      = ""
  TURSO_AUTH_TOKEN        = ""
  SUPABASE_SERVICE_ROLE_KEY = ""

[context.branch-deploy.environment]
  JWT_SECRET              = "branch-deploy-not-configured"
  DATABASE_URL            = ""
  SUPABASE_DB_URL         = ""
  TURSO_DATABASE_URL      = ""
  TURSO_AUTH_TOKEN        = ""
  SUPABASE_SERVICE_ROLE_KEY = ""

# Local `netlify dev`. Same reasoning, and this is where a developer is most
# likely to have a real DATABASE_URL in their shell and be surprised that
# `netlify dev` can wipe production.
[dev.environment]
  DATABASE_URL            = ""
  SUPABASE_DB_URL         = ""
  TURSO_DATABASE_URL      = ""
  TURSO_AUTH_TOKEN        = ""
  SUPABASE_SERVICE_ROLE_KEY = ""

# -----------------------------------------------------------------------------
# Functions
# -----------------------------------------------------------------------------
[functions]
  directory = "netlify/functions"
  # The functions are CommonJS on Node 24.
  node_bundler = "esbuild"

  # @libsql/client loads its platform-native binary through an OPTIONAL
  # dependency (@libsql/linux-x64-gnu, or the musl/darwin equivalents). esbuild
  # cannot see through that conditional require, so it is left unresolved and
  # the function dies at runtime with:
  #   Error: Cannot find module '@libsql/linux-x64-gnu'
  # Shipping the platform packages alongside the bundle resolves it.
  included_files = [
    "node_modules/@libsql/**",
    "node_modules/libsql/**",
  ]

# -----------------------------------------------------------------------------
# Local dev server
#
# NOTE: there is deliberately NO `command` here.
#
# `netlify dev` is used to exercise the FUNCTIONS against the already-built
# site, so it should serve the publish directory directly. This section used to
# run `npm run dev:hugo` (hugo server on :1313) as well, which made
# `netlify dev` spawn a second server and die with
# "listen tcp 127.0.0.1:1313: bind: address already in use".
#
# For front-end work use `make dev` (plain hugo server, no functions), or
# `make dev-all` to run both.
# -----------------------------------------------------------------------------
[dev]
  # `publish` is resolved against `dir`, not against the repository root --
  # netlify.toml paths are absolute relative to the base directory, and `dir`
  # IS that base. With dir = "site" the correct value is therefore
  # "public", not "site/public"; the old pair resolved to site/site/public and
  # `netlify dev` served a 404 for every page.
  publish = "public"
  port = 8888
  autoLaunch = false
  dir = "site"

# -----------------------------------------------------------------------------
# Redirects
#
# NOTE: `/api/*` used to rewrite every /api/ call to /.netlify/functions/$1.
# The functions in this repo are NOT mounted under /api/ -- they are called by
# their own names (e.g. /contact-form -> contact-form function), either
# directly at /.netlify/functions/<name> or through these aliases below.
# -----------------------------------------------------------------------------
# The admin gate. Reasoning in docs/ADMIN-GATE.md.
#
#   /admin/*    -> guard, which checks the session
#   /.__admin/* -> the real static file, and NOT itself guarded
#
# The second rule is what makes it loop-free: the guard cannot send an
# authorised visitor back to /admin/<path> (that is what got them here), and it
# cannot return 200 with an empty body (a 200 rewrite makes the FUNCTION's
# response the response -- a blank page that looks like an empty dashboard).
# Keep /admin/cms ABOVE these: the CMS has its own Identity login and does not
# need the extra hop.
[[redirects]]
  from = "/admin/cms"
  to = "/cms.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/admin-guard/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/.__admin/*"
  to = "/admin/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health-check"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact-form"
  status = 200

[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead-form"
  status = 200

# NOTE: there is deliberately NO /api/inventory alias. One pointed at
# inventory-api, which was deleted in 45021f9 -- the inventory page is
# server-rendered from the content files scripts/inventory/ writes, so a runtime
# read endpoint has no consumer. The alias outlived its function and 404'd.

# Netlify CMS. `cms.html` is served from site/static and loads /cms.js, which is
# produced by the one remaining webpack build (webpack.cms.js).

# -----------------------------------------------------------------------------
# Headers
#
# Fingerprinted assets under /css and /js carry a content hash in the filename,
# so they are safe to cache immutably. Everything else stays revalidated.
# -----------------------------------------------------------------------------
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /img/* holds two different kinds of file and they must not share a policy.
#
# Hugo's derived variants carry a content hash (home-jumbotron_hu_<hash>.avif),
# so they are safe to cache forever. The rest have STABLE names -- favicon.ico,
# logo.svg, og-image.jpg, the mstile set, safari-pinned-tab.svg -- and an
# `immutable` year on those means a changed og-image.jpg could not reach a
# returning visitor for 365 days. The hashed ones are matched by shape below.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Content-hashed derivatives anywhere under /img: safe forever.
[[headers]]
  for = "/img/*_*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icons and the social card change on a design edit, not on a deploy cadence.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Vehicle photography. Mirrored once daily by scripts/inventory/images.js and
# re-encoded at build time by Hugo's libvips, so every filename embeds a content
# hash: if the bytes change the name changes. Safe to cache forever.
[[headers]]
  for = "/vehicles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept"

# AVIF/WebP variants are content-hashed too, so they need no revalidation.
[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The CMS bundle is fingerprinted only by webpack's content, and rebuilt often.
[[headers]]
  for = "/cms.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Service worker must never be cached, or clients get stuck on an old one.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    # Netlify terminates TLS and redirects to it, so HSTS belongs here. Without
    # it a first visit can still be intercepted over plain http. `preload` is
    # deliberately NOT requested: submitting a domain to the preload list is
    # effectively irreversible, and that is the owner's call, not a build
    # setting. max-age is a year, which is the value preload requires.
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"
    # Netlify Identity is required for the CMS and the customer portal login.
    # The social embeds on the home page (connect.js) need Facebook and Twitter
    # domains. Without them the CSP blocks the Facebook page plugin iframe and
    # the Twitter timeline widget, so the "What Ed is posting" panel renders
    # empty. These are the minimum domains required for those two embeds.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://unpkg.com https://connect.facebook.net https://platform.twitter.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://syndication.twitter.com; connect-src 'self' https://*.netlify.app https://*.supabase.co wss://*.supabase.co; frame-src 'self' https://www.facebook.com https://syndication.twitter.com https://platform.twitter.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# -----------------------------------------------------------------------------
# Edge/bot handling
# -----------------------------------------------------------------------------
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/cms.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
