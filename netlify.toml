[build]
  publish = "site/public"
  command = "npm run build:production"

[build.environment]
  NODE_VERSION = "18"
  HUGO_VERSION = "0.119.0"

[dev]
  command = "./hugo server -D -F --source=site --bind 0.0.0.0 --port 1313 --buildDrafts --buildFuture"
  publish = "site/public"
  port = 1313

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health-check"
  status = 200

[[redirects]]
  from = "/health/*"
  to = "/.netlify/functions/health-check/:splat"
  status = 200