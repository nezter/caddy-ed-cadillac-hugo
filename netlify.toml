# -----------------------------------------------------------------------------
# Functions
# -----------------------------------------------------------------------------
[functions]
  directory = "netlify/functions"
  # The functions are CommonJS on Node 24.
  node_bundler = "esbuild"

  # Nothing is force-included any more, and that is a 320 MB saving.
  #
  # This used to say:
  #
  #     included_files = ["node_modules/@libsql/**", "node_modules/libsql/**"]
  #
  # with the reason that @libsql/client loads its platform-native binary through
  # an OPTIONAL dependency that esbuild cannot see through a conditional require,
  # so functions died at runtime with:
  #
  #     Error: Cannot find module '@libsql/linux-x64-gnu'
  #
  # That reason was real, and the fix was right AT THE TIME. But the diagnosis
  # has since changed: the code requires `@libsql/client/http`, which is the same
  # createClient with the same arguments and none of the local-file transports.
  # A database reached over HTTPS at a libsql:// URL cannot be opened through a
  # Linux native binding at all.
  #
  # So those 20 MB -- a 10 MB binary for glibc and another for musl -- were being
  # copied into all 41 function bundles, zipped, uploaded and unpacked on every
  # cold start, for a module no code path could load. Measured: the function
  # bundle was 317 MB for a 67-page static site.
  #
  # esbuild traces what is actually required, so with the native transport gone
  # there is nothing to force-include. ci/verify-functions.js loads every bundled
  # function, which is the check that would catch a genuine missing module -- and
  # it runs on every build.
  #
  # If a missing module ever does appear, the fix is to add THAT module back here,
  # not to re-add the platform packages wholesale.

# -----------------------------------------------------------------------------
# Local dev server
#
# NOTE: there is deliberately NO `command` here.
#
# `netlify dev` is used to exercise the FUNCTIONS against the already-built
# site, so it should serve the publish directory directly. This section used to
# run `npm run dev:hugo` (hugo server on :1313) as well, which made
# `netlify dev` spawn a second server and die with
# "listen tcp 127.0.0.1:1313: bind: address already in use".
#
# For front-end work use `make dev` (plain hugo server, no functions), or
# `make dev-all` to run both.
# -----------------------------------------------------------------------------
[dev]
  # `publish` is resolved against `dir`, not against the repository root --
  # netlify.toml paths are absolute relative to the base directory, and `dir`
  # IS that base. With dir = "site" the correct value is therefore
  # "public", not "site/public"; the old pair resolved to site/site/public and
  # `netlify dev` served a 404 for every page.
  publish = "public"
  port = 8888
  autoLaunch = false
  dir = "site"

# -----------------------------------------------------------------------------
# Redirects
#
# NOTE: `/api/*` used to rewrite every /api/ call to /.netlify/functions/$1.
# The functions in this repo are NOT mounted under /api/ -- they are called by
# their own names (e.g. /contact-form -> contact-form function), either
# directly at /.netlify/functions/<name> or through these aliases below.
# -----------------------------------------------------------------------------
# The admin gate. Reasoning in docs/ADMIN-GATE.md.
#
#   /admin/*    -> guard, which checks the session
#   /.__admin/* -> the real static file, and NOT itself guarded
#
# The second rule is what makes it loop-free: the guard cannot send an
# authorised visitor back to /admin/<path> (that is what got them here), and it
# cannot return 200 with an empty body (a 200 rewrite makes the FUNCTION's
# response the response -- a blank page that looks like an empty dashboard).
# Keep /admin/cms ABOVE these: the CMS has its own Identity login and does not
# need the extra hop.
[[redirects]]
  from = "/admin/cms"
  to = "/cms.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/admin-guard/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/.__admin/*"
  to = "/admin/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health-check"
  status = 200

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact-form"
  status = 200

[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead-form"
  status = 200

# NOTE: there is deliberately NO /api/inventory alias. One pointed at
# inventory-api, which was deleted in 45021f9 -- the inventory page is
# server-rendered from the content files scripts/inventory/ writes, so a runtime
# read endpoint has no consumer. The alias outlived its function and 404'd.

# Netlify CMS. `cms.html` is served from site/static and loads /cms.js, which is
# produced by the one remaining webpack build (webpack.cms.js).

# -----------------------------------------------------------------------------
# Headers
#
# Fingerprinted assets under /css and /js carry a content hash in the filename,
# so they are safe to cache immutably. Everything else stays revalidated.
# -----------------------------------------------------------------------------
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted display fonts (Inter Tight, Instrument Serif), served from
# site/static/fonts. These have STABLE, non-hashed filenames, so they must NOT
# be immutable -- a replaced font file would otherwise be unreachable for a year
# on any client that had already fetched it. Same reasoning the repository
# already applies to the stable-name half of /img/* below: a day of freshness,
# then revalidate in the background.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# /img/* : ONE rule, deliberately.
#
# This used to try to be cleverer -- a generic rule for stable names
# (favicon.ico, og-image.jpg, the mstile set ...) plus an `immutable` rule
# for Hugo's content-hashed derivatives (/img/*_*) -- and it was wrong
# twice over: the generic rule was duplicated, and Netlify COMBINES every
# matching header rule instead of picking one ("any custom headers that
# match for a path combine instead of cancelling out" -- Netlify staff,
# answers.netlify.com). A hashed file therefore collected BOTH
# Cache-Control values, and a conflicting duplicate is worse than either
# policy alone.
#
# Globs cannot say "everything except *_*", so the honest choice is one
# policy for the whole directory: a day of freshness, then stale-while-
# revalidate. Hashed derivatives give up a theoretical year of immutability;
# correctness of the served headers is worth more than the micro-cache.
# ci/check-netlify-config.js fails if overlapping Cache-Control rules
# (or duplicate rules) ever come back.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Vehicle photography. Mirrored once daily by scripts/inventory/images.js and
# re-encoded at build time by Hugo's libvips, so every filename embeds a content
# hash: if the bytes change the name changes. Safe to cache forever.
[[headers]]
  for = "/vehicles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept"

# (The /*.avif and /*.webp globals that sat here were removed in the same
#  pass: every avif/webp in the build lives under /img/ or /vehicles/, so
#  the globals only ever doubled up on the directory rules -- conflicting
#  with /img's value and duplicating /vehicles'. Each directory now
#  carries exactly one Cache-Control rule.)

# The CMS bundle is fingerprinted only by webpack's content, and rebuilt often.
[[headers]]
  for = "/cms.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Service worker must never be cached, or clients get stuck on an old one.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    # Netlify terminates TLS and redirects to it, so HSTS belongs here. Without
    # it a first visit can still be intercepted over plain http. `preload` is
    # deliberately NOT requested: submitting a domain to the preload list is
    # effectively irreversible, and that is the owner's call, not a build
    # setting. max-age is a year, which is the value preload requires.
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"
    # What actually needs an allowance, verified 2026-10:
    #   - identity.netlify.com: the Netlify Identity widget (CMS login at
    #     /cms.html and the staff sign-in page). Script AND connect -- the
    #     widget talks to the Identity API by XHR, which the old policy
    #     forgot, so login could be blocked by our own CSP.
    #   - www.google.com + www.gstatic.com: reCAPTCHA on the Netlify Forms
    #     (the stock-alert form) -- api script, challenge iframe, XHRs.
    # Everything else is gone: the social embeds were replaced by the cached
    # first-party feed (social-feed.js), fonts are self-hosted, and no
    # browser code talks to Supabase or other netlify.app origins anymore.
    # ci/check-netlify-config.js fails if a stale origin (unpkg,
    # fonts.googleapis, cdnjs, supabase) reappears in any CSP copy.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://identity.netlify.com https://www.google.com; frame-src 'self' https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# -----------------------------------------------------------------------------
# Edge/bot handling
# -----------------------------------------------------------------------------
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/cms.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
