baseURL = "https://www.caddyedcadillac.com/"
languageCode = "en-us"
title = "Caddy Ed Cadillac"
enableRobotsTXT = true
disableKinds = ["taxonomyTerm"]
pygmentsCodeFences = true
pygmentsUseClasses = true

[params]
  description = "Cadillac dealer serving the area with exceptional service, new and pre-owned vehicles, and factory-certified maintenance."
  mainCSS = "/main.css" # This will be replaced with fingerprinted version in production
  
  # Critical CSS settings
  enableCriticalCSS = true
  criticalCSSPath = "/critical/"
  
  # Template type mappings for critical CSS
  [params.criticalCSSTemplates]
    home = "home"
    inventory = "inventory-list"
    vehicle = "inventory-detail"
    contact = "contact"
    default = "default"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Inventory"
    url = "/inventory/"
    weight = 2
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3
  [[menu.main]]
    name = "Services"
    url = "/services/"
    weight = 4
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 5

[outputFormats.WebAppManifest]
  mediaType = "application/manifest+json"
  rel = "manifest"

[outputs]
  home = ["HTML", "RSS", "WebAppManifest"]
  page = ["HTML"]
  section = ["HTML"]
