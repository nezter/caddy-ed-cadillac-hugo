# nginx.conf template for ci/preview.sh
#
# PLACEHOLDER_ROOT is replaced by the script with the artifact directory.
# Kept as a template file rather than an inline heredoc because nginx needs
# literal $uri / $host, which collide with shell expansion.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  keepalive_timeout 15;

  server {
    listen 80;
    server_name _;

    # This is the path INSIDE the container. ci/preview.sh bind-mounts the
    # host artifact directory here, so nginx must not be told the host path.
    root /usr/share/nginx/html;
    index index.html;

    # The verified build already emits long-lived cache headers for
    # fingerprinted assets, so they are served verbatim.

    # This preview is static -- the Netlify functions are not part of it.
    # Answer truthfully instead of 404ing, so nobody debugs a phantom outage.
    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","mode":"static-preview","functions":"not running in this preview"}';
    }

    location /.netlify/ {
      default_type application/json;
      return 200 '{"error":"Netlify Functions are not running in this static preview. Use netlify dev for the full API."}';
    }

    # Never cache the service worker, same as production.
    location = /sw.js {
      add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / { try_files $uri $uri/ =404; }
  }
}
