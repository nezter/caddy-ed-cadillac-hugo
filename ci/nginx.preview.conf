# nginx.conf template for ci/preview.sh
#
# PLACEHOLDER_ROOT is replaced by the script with the artifact directory.
# Kept as a template file rather than an inline heredoc because nginx needs
# literal $uri / $host, which collide with shell expansion.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  keepalive_timeout 15;

  server {
    listen 80;
    server_name _;

    # This is the path INSIDE the container. ci/preview.sh bind-mounts the
    # host artifact directory here, so nginx must not be told the host path.
    root /usr/share/nginx/html;
    index index.html;

    # The verified build already emits long-lived cache headers for
    # fingerprinted assets, so they are served verbatim.

    # -------------------------------------------------------------------------
    # SECURITY HEADERS -- these must match netlify.toml, and until 2026-09-27
    # they did not exist here at all.
    #
    # That omission is not a neutral default; it is a preview that lies by
    # omission, and it hid a total production failure.
    #
    # site/layouts/partials/entry.html built every page-scoped bundle with a
    # targetPath that dropped the .js extension, so the CDN had no idea those
    # files were JavaScript and served them as application/octet-stream. Under
    # netlify.toml's `X-Content-Type-Options: nosniff` a browser refuses to
    # execute a classic script that is not a JavaScript MIME type -- so on
    # production every one of those bundles would have silently refused to run:
    # all 12 admin dashboards, the customer portal, staff sign-in, vehicle
    # detail, the inventory filter.
    #
    # This preview had no nosniff, and Firefox executes an octet-stream classic
    # script anyway when nosniff is absent. So the preview looked perfect, all
    # four build gates passed, and the site would have shipped broken.
    #
    # A preview that does not reproduce the headers under test is a preview
    # that cannot catch header-dependent bugs. These are copied from
    # netlify.toml's [[headers]] block on purpose -- if you change one, change
    # both, and ci/verify-build.js cross-checks that they have not drifted.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Mirrors netlify.toml. Kept verbatim, 'unsafe-inline' included, so the
    # preview does not "pass" something production would fail. Fixing the CSP
    # properly is a separate piece of work (OPEN-QUESTIONS.md Q4).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://*.netlify.app https://*.supabase.co wss://*.supabase.co; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # This preview is static -- the Netlify functions are not part of it.
    # Answer truthfully instead of 404ing, so nobody debugs a phantom outage.
    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","mode":"static-preview","functions":"not running in this preview"}';
    }

    location /.netlify/ {
      default_type application/json;
      return 200 '{"error":"Netlify Functions are not running in this static preview. Use netlify dev for the full API."}';
    }

    # Never cache the service worker, same as production.
    location = /sw.js {
      add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / { try_files $uri $uri/ =404; }

    # Tell the front end there are no Netlify functions in this static preview.
    # The scheduling calendar checks window.__STATIC_PREVIEW__ and skips its
    # availability fetches instead of logging a 404 on every page load.
    #
    # This is injected as a script rather than sent as a response header because
    # a header is invisible to the page's own JavaScript -- the calendar would
    # still fetch, still 404, and the flag would have done nothing.
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '<head>' '<head><script>window.__STATIC_PREVIEW__ = true;</script>';
  }
}
