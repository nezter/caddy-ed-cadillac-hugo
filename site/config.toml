# The production origin. This MUST be absolute and MUST be the real domain.
#
# It was "/" and nothing overrode it, so every canonical link, every og:url and
# every sitemap entry on the site was emitted as a relative path:
#
#     <link rel=canonical href=/>
#     <meta property="og:url" content="/">
#
# Search engines and social crawlers require absolute URLs for both. A
# production build with a relative baseURL is a silent SEO failure -- every
# page looks like a duplicate of every other page.
#
# Hugo reads HUGO_BASEURL from the environment, so local and preview builds
# override it rather than shipping a caddyed.com canonical to a dev host.
baseURL = "https://caddyed.com/"
locale = "en-us"
title = "Caddy Ed - Cadillac Sales Specialist"
enableRobotsTXT = true
disableKinds = ["RSS"]

[params]
  description = "Caddy Ed - Your Cadillac Sales Specialist in South Charlotte. New & Pre-Owned Cadillac inventory, test drives, and trade-in valuations."
  # Social share card. 1200x630, the size both Facebook and Twitter
  # crop to. Read by partials/head-meta.html as .Site.Params.og_image.
  # This was `images = ["img/caddy-ed-logo.jpg"]` -- wrong key, and
  # the file it named did not exist.
  og_image = "img/og-image.jpg"
  title = "Caddy Ed - Cadillac Sales Specialist"
  dealer_name = "Cadillac of South Charlotte"
  phone = "704-555-1234"
  email = "ed@caddyed.com"
  address = "123 Cadillac Drive, Charlotte, NC 28210"
  hours = "Mon-Fri 9am-7pm &middot; Sat 9am-5pm"
  years_selling = "1999"

  # Home page hero. Referenced by layouts/index.html; override per-page with
  # `hero_image` in front matter.
  hero_image = "img/home-jumbotron.jpg"
  hero_image_alt = "A Cadillac on display at Caddy Ed Cadillac, South Charlotte"
  
[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "inventory"
    name = "Inventory"
    url = "/inventory/"
    weight = 2
  [[menu.main]]
    identifier = "specials"
    name = "Specials"
    url = "/specials/"
    weight = 3
  [[menu.main]]
    identifier = "financing"
    name = "Financing"
    url = "/financing/"
    weight = 4
  [[menu.main]]
    identifier = "trade-in"
    name = "Trade-In"
    url = "/trade-in/"
    weight = 5
  [[menu.main]]
    identifier = "about"
    name = "About Ed"
    url = "/about/"
    weight = 6
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 7

[taxonomies]
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "JSON"]
  page = ["HTML"]
