{{ define "title" }}Vehicle Inventory | {{ .Site.Title }}{{ end }}
{{ define "description" }}Browse our extensive inventory of Cadillac vehicles at competitive prices.{{ end }}

{{ define "main" }}
<div class="inventory-container container py-5">
  <aside class="inventory-filters" id="inventory-filters">
    <!-- Filter UI will be rendered here by JS -->
  </aside>

  <main class="inventory-main">
    <!-- Sort controls -->
    <div class="inventory-sort-container">
      <label for="inventory-sort" class="inventory-sort-label">Sort by:</label>
      <select id="inventory-sort" class="inventory-sort">
        <option value="featured">Featured</option>
        <option value="price-asc">Price (Low to High)</option>
        <option value="price-desc">Price (High to Low)</option>
        <option value="year-desc">Year (Newest First)</option>
        <option value="year-asc">Year (Oldest First)</option>
        <option value="model-asc">Model (A-Z)</option>
        <option value="model-desc">Model (Z-A)</option>
      </select>
    </div>

    <!-- Results count -->
    <div class="results-count">Loading inventory...</div>

    <!-- Results container -->
    <div id="vehicle-inventory" class="vehicle-inventory">
      <div class="loading-spinner"></div>
    </div>

    <!-- Mobile filter toggle -->
    <button class="filter-toggle" aria-label="Toggle filters">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
        <path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5v-2z"/>
      </svg>
      <span>Filters</span>
    </button>
  </main>
</div>
{{ end }}
