<div class="customer-login-form" id="customerLoginForm">
  <div class="login-container">
    <h2>Customer Login</h2>
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="customerEmail">Email Address</label>
        <input type="email" id="customerEmail" name="email" required placeholder="your.email@example.com">
      </div>

      <div class="form-group">
        <label for="customerPhone">Phone Number</label>
        <input type="tel" id="customerPhone" name="phone" required placeholder="(704) 555-0123">
      </div>

      <button type="submit" class="btn btn-primary" id="loginButton">
        <span class="button-text">Access My Portal</span>
        <span class="loading-spinner" style="display: none;">Loading...</span>
      </button>
    </form>

    <div class="login-help">
      <p>Don't have an account? <a href="/contact">Contact us</a> to get started.</p>
    </div>
  </div>
</div>
