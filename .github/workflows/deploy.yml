name: Deploy

# =============================================================================
# Production deploy for caddyed.com
#
# Manual, confirmation-gated, and it does NOT run a Netlify build. It builds
# on the self-hosted runner -- the same self-contained shape as the dev lane
# (deploy-dev.yml) -- and uploads the result:
#
#     netlify deploy --prod --dir=site/public --functions=netlify/functions
#
# `netlify deploy --dir` uploads an already-built directory, so Netlify never
# starts a builder and ZERO build minutes are consumed. The site's
# skip_automatic_builds is enabled precisely so that a git push can never
# silently start a remote build.
#
# WHY IT BUILDS ITSELF (2026-10): it used to download a `site-public`
# artifact from ci-cd.yml -- but actions/download-artifact reads artifacts
# from the SAME workflow run, and this workflow has no build job, so the
# download could never find anything. The first real dispatch would have died
# on step one. It now builds inline, exactly the way the dev lane has been
# doing, and the two workflows differ only in --prod and the smoke targets.
#
# One way to run it: GitHub UI -> Actions -> Deploy -> Run workflow. The
# file must exist on the DEFAULT branch for workflow_dispatch to be offered,
# which is why the default branch is modernize/netlify-build-2026.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to publish to production (caddyed.com)'
        required: true
        default: ''
      reason:
        description: 'Why is this being deployed?'
        required: true
        default: ''

permissions:
  contents: read

# Only one production deploy at a time, ever.
concurrency:
  group: netlify-production-deploy
  cancel-in-progress: false

env:
  # The self-hosted runner lives ON the CI host, so the build host is
  # loopback; GitHub-hosted runners have no route to a private LAN address,
  # which is why the previous SSH-to-10.1.0.25 shape could never run.
  CI_HOST: 127.0.0.1
  CI_USER: gha
  IMAGE: caddy-netlify-build:2026
  SITE_ID: 532a7445-ce96-40c1-bebb-b9d14a0d0e10

jobs:
  deploy:
    name: Build, verify, and publish to production
    runs-on: [self-hosted, caddy-ci]
    timeout-minutes: 45
    environment: production
    env:
      # Same per-run workdir pattern as ci-cd.yml and deploy-dev.yml so
      # concurrent or cancelled runs cannot delete each other's files.
      REMOTE_WORKDIR: /var/lib/gitlab-runner/gha-work/${{ github.job }}-caddy-prod-${{ github.run_id }}
    steps:
      - name: Verify the operator really meant it
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo "::error::confirmation must be exactly 'deploy'"
            exit 1
          fi

      - name: Verify the build image exists
        run: |
          set -euo pipefail
          podman image exists "$IMAGE" \
            || { echo "::error::image $IMAGE missing -- run: ./ci/run.sh image"; exit 1; }

      - name: Resolve Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # Fail BEFORE any build work: a deploy that dies on a missing token
          # after two minutes has told you nothing new.
          #
          # Two ways to be credentialed, checked in order:
          #   1. the repo secret (works anywhere; prefer it when present);
          #   2. the netlify CLI login ON THIS RUNNER HOST -- the pipeline
          #      that originally deployed this site ran where the token
          #      lived (~/.config/netlify/config.json, commit 52d88e8),
          #      and the runner IS that host. Accepting the host login is
          #      not a shortcut; it restores how the deploy actually worked
          #      until this workflow started demanding a second copy.
          if [ -n "$NETLIFY_AUTH_TOKEN" ]; then
            echo "MODE=secret" >> "$GITHUB_ENV"
            echo "Using the NETLIFY_AUTH_TOKEN repo secret"
            exit 0
          fi
          CFG=""
          if [ -f "$HOME/.config/netlify/config.json" ]; then CFG="$HOME/.config/netlify/config.json";
          elif [ -f "$HOME/.netlify/config.json" ]; then CFG="$HOME/.netlify/config.json"; fi
          if [ -n "$CFG" ]; then
            echo "MODE=hostconfig" >> "$GITHUB_ENV"
            echo "HOST_NETLIFY_CONFIG=$CFG" >> "$GITHUB_ENV"
            echo "Using the netlify CLI login stored on this host"
            exit 0
          fi
          echo "::error::no Netlify credentials on this runner and no NETLIFY_AUTH_TOKEN secret"
          echo "Checked: env NETLIFY_AUTH_TOKEN, ~/.config/netlify/config.json, ~/.netlify/config.json"
          echo "Either add the repo secret, or run netlify login once as this runner user."
          exit 1

      - uses: actions/checkout@v7

      - name: Reject dirty working trees
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is dirty; the deployed artifact must match a commit"
            git status --short
            exit 1
          fi

      - name: Production build (via ci/run.sh, in the pinned image)
        env:
          # ci/run.sh deletes its per-run workdir on exit; hold it open so the
          # publish dir can be pulled back into the checkout below.
          CLEANUP: 0
        run: ./ci/run.sh build

      - name: Pull the publish dir back from the CI-host workdir
        run: |
          set -euo pipefail
          rsync -az "${CI_USER}@${CI_HOST}:${REMOTE_WORKDIR}/site/public/" site/public/
          rm -rf "${REMOTE_WORKDIR:-/nonexistent}"
          test -f site/public/index.html || { echo "::error::no index.html after the pull-back"; exit 1; }
          echo "pages: $(find site/public -name '*.html' | wc -l)"

      - name: Asset gate against the artifact
        run: |
          set -euo pipefail
          # Same gate the rest of the pipeline runs, in the build image -- the
          # runner host has no node.
          podman run --rm -v "$PWD":/site:Z -w /site "$IMAGE" \
            bash -lc 'node ci/verify-build.js site/public'

      - name: Upload prebuilt site to production (no build minutes used)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID_SECRET: ${{ secrets.NETLIFY_SITE_ID }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          SITE="${NETLIFY_SITE_ID_SECRET:-$SITE_ID}"
          # Inputs are free text; strip the one character class that could
          # break the message quoting below.
          SAFE_REASON="${REASON//\"/}"
          MSG="production: ${GITHUB_SHA} by ${GITHUB_ACTOR}${SAFE_REASON:+ -- $SAFE_REASON}"
          # The CLI runs from the pinned image so the tool version is
          # reproducible. --prod is what makes it the live site; there is no
          # other workflow that passes it.
          # When the credential is this host's CLI login, hand that login to
          # the container's root user (the image runs the CLI as root); the
          # CLI then reads it without any variable being set.
          MOUNT_ARGS=()
          if [ "${MODE:-}" = "hostconfig" ]; then
            MOUNT_ARGS=(-v "$HOST_NETLIFY_CONFIG:/root/.config/netlify/config.json:ro")
          fi
          podman run --rm -v "$PWD":/site:Z -w /site \
            -e NETLIFY_AUTH_TOKEN -e NETLIFY_SITE_ID="$SITE" \
            "${MOUNT_ARGS[@]}" \
            -e DEPLOY_MSG="$MSG" \
            "$IMAGE" \
            bash -lc 'netlify deploy --prod --site="$NETLIFY_SITE_ID" --dir=site/public --functions=netlify/functions --message="$DEPLOY_MSG"' \
            2>&1 | tee deploy-log.txt
          DEPLOY_URL=$(grep -Eo 'https://[a-z0-9-]+--vibrant-ritchie-0cef93\.netlify\.app' deploy-log.txt | head -1 || true)
          {
            echo "### Production deployed"
            echo ""
            echo "- https://caddyed.com/"
            echo "- Deploy: ${DEPLOY_URL:-not parsed from CLI output}"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post-deploy smoke test
        run: |
          set -euo pipefail
          fail=0
          # 200s: the pages, the feed, and the function alias.
          for url in \
            "https://caddyed.com/" \
            "https://caddyed.com/inventory/" \
            "https://caddyed.com/articles/" \
            "https://caddyed.com/articles/index.xml" \
            "https://caddyed.com/health"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$url" || echo 000)
            echo "$code (want 200)  $url"
            [ "$code" = "200" ] || fail=1
          done
          # The admin gate must still redirect (302) rather than serve.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "https://caddyed.com/admin/" || echo 000)
          echo "$code (want 302)  https://caddyed.com/admin/"
          [ "$code" = "302" ] || fail=1
          # Prove it is THIS build, not the old one: the modernized footer
          # links /articles/ and the feed exists. The February build had
          # neither.
          if ! curl -fsS --max-time 25 https://caddyed.com/ | grep -Eq 'href="?/articles/'; then
            echo "::error::smoke: home page does not carry the modernized build marker"
            fail=1
          fi
          if [ "$fail" != "0" ]; then
            echo "::error::production smoke test failed"
            exit 1
          fi
          echo "production is up: https://caddyed.com/"

      - name: Clean up the CI-host workdir
        if: always()
        run: rm -rf "${REMOTE_WORKDIR:-/nonexistent}" || true
