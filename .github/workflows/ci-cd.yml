name: CI/CD

# =============================================================================
# caddy-ed-cadillac-hugo
#
# Design constraints (deliberate):
#
#  * NO job here ever deploys to Netlify. Netlify's remote builders are
#    disabled on the site (skip_automatic_builds) because the monthly build
#    allowance is scarce and the old remote builds could never succeed. The
#    production site is updated by uploading a prebuilt directory
#    (netlify deploy --dir=...), which consumes no build minutes.
#
#  * Every build runs on the CI host (10.1.0.25) inside the
#    caddy-netlify-build:2026 image, which pins Node 24, Hugo Extended 0.166.0
#    and @netlify/build so local and CI builds are byte-for-byte comparable.
#
#  * GitHub-hosted runners are used only as an ORCHESTRATOR: they SSH to the CI
#    host and invoke ci/run.sh. No compilation happens on GitHub infrastructure.
#
# Deploys are a separate, manual workflow (see .github/workflows/deploy.yml).
# =============================================================================

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_HOST: 10.1.0.25
  IMAGE: caddy-netlify-build:2026
  HUGO_VERSION: '0.166.0'
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------------------
  # Gate: the build image must exist on the CI host and be the right version.
  # Building it is a deliberate, manual step -- a CI run must never mutate the
  # shared CI host or race with a concurrent job.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight (CI host + image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify CI host is reachable
        run: |
          set -euo pipefail
          for i in $(seq 1 5); do
            if ssh -o ConnectTimeout=8 -o StrictHostKeyChecking=no "$CI_HOST" true; then
              echo "CI host reachable"; exit 0
            fi
            echo "attempt $i failed, retrying..."; sleep 5
          done
          echo "::error::CI host $CI_HOST unreachable"
          exit 1

      - name: Verify build image exists and reports the expected toolchain
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no "$CI_HOST" \
            "podman image exists '$IMAGE' || { echo '::error::image $IMAGE missing -- run: make image'; exit 1; }
             podman run --rm '$IMAGE' bash -lc 'node -v; npm -v; hugo version; netlify --version'"
          # Node 24 + Hugo Extended are hard requirements.
          ssh -o StrictHostKeyChecking=no "$CI_HOST" \
            "podman run --rm '$IMAGE' bash -lc 'hugo version | grep -q \"+extended\"' \
             || { echo '::error::image hugo is not extended'; exit 1; }"

  # ---------------------------------------------------------------------------
  # Build + asset verification, entirely on the CI host.
  # ---------------------------------------------------------------------------
  build:
    name: Build & verify assets
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify (on CI host)
        run: ./ci/run.sh verify

      - name: Archive publish directory
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: site/public
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Tests for the Netlify functions.
  # ---------------------------------------------------------------------------
  test:
    name: Functions tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run jest suite (on CI host)
        run: ./ci/run.sh test

  # ---------------------------------------------------------------------------
  # Lint. Pinned to the versions in package.json rather than floating.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ESLint (on CI host)
        run: |
          set -euo pipefail
          ./ci/run.sh sync
          ssh -o StrictHostKeyChecking=no "$CI_HOST" \
            "podman run --rm -v /var/tmp/caddy-build:/site:Z -w /site '$IMAGE' \
               bash -lc 'npm install --no-audit --no-fund >/dev/null && npm run lint'"

  # ---------------------------------------------------------------------------
  # Dependency audit. Informational for the front end, blocking for high/critical
  # in the functions bundle (those are the ones exposed to the internet).
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit netlify/functions
        run: |
          set -euo pipefail
          ./ci/run.sh sync
          ssh -o StrictHostKeyChecking=no "$CI_HOST" \
            "podman run --rm -v /var/tmp/caddy-build:/site:Z -w /site '$IMAGE' \
               bash -lc 'cd netlify/functions && npm install --no-audit --no-fund >/dev/null && npm audit --audit-level=high'"

  # ---------------------------------------------------------------------------
  # Security scanning. Trivy is pinned to a release tag (the old workflow used
  # @master, which is an unpinned third-party code-execution risk).
  # ---------------------------------------------------------------------------
  security:
    name: Security scan
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          # The repo is full of vendored/legacy scripts; scan the live code only.
          skip-dirs: "node_modules,site/public,.git,bin"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Single source of truth for a green build.
  # ---------------------------------------------------------------------------
  ci-green:
    name: CI green
    needs: [build, test, lint, audit, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          set -euo pipefail
          echo "build=${{ needs.build.result }} test=${{ needs.test.result }} lint=${{ needs.lint.result }} audit=${{ needs.audit.result }} security=${{ needs.security.result }}"
          for job in build test lint audit security; do
            if [ "${{ needs.$job.result }}" != "success" ]; then
              echo "::error::job '$job' finished as ${{ needs.$job.result }}"
              exit 1
            fi
          done
          echo "All required jobs passed."
